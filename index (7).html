<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senna — Resource Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Theme variables ── */
:root{
  --font:'Bai Jamjuree',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --done:#10b981;--doing:#f59e0b;--todo:#475569;--danger:#ef4444;--warn:#f59e0b;
  --holiday:#7c3aed;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b27;--bg3:#1e2535;
  --surface:#252d3d;--surface2:#2d3648;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#5a6785;
  --accent:#6366f1;--accent2:#818cf8;
  --we-bg:rgba(255,255,255,0.018);--holiday-bg:rgba(124,58,237,0.12);
  --today-line:#ef4444;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --frozen-bg:#1a2235;--frozen-text:#c8d0e0;--frozen-border:rgba(255,255,255,0.12);
  --sprint-row-bg:#1e2a42;--sprint-row-text:#818cf8;
  --proj-row-text:#ffffff;
  --row-line:rgba(255,255,255,0.06);
}
[data-theme="light"]{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;
  --surface:#e2e8f0;--surface2:#cbd5e1;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --accent:#4f46e5;--accent2:#6366f1;
  --we-bg:rgba(0,0,0,0.025);--holiday-bg:rgba(124,58,237,0.08);
  --today-line:#ef4444;
  --shadow:0 8px 32px rgba(0,0,0,0.12);
  --frozen-bg:#ffffff;--frozen-text:#1e293b;--frozen-border:rgba(0,0,0,0.12);
  --sprint-row-bg:#eef2ff;--sprint-row-text:#4f46e5;
  --proj-row-text:#ffffff;
  --row-line:rgba(0,0,0,0.06);
}

html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;height:100%;overflow:hidden}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:13.5px;color:var(--text)}

/* ── Layout ── */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:214px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:18px 18px 14px;font-size:17px;font-weight:600;letter-spacing:-.5px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-logo-text span{color:var(--accent2)}
.theme-toggle{background:none;border:1px solid var(--border2);border-radius:var(--r);padding:4px 8px;font-size:13px;color:var(--text2);transition:all .15s}
.theme-toggle:hover{background:var(--surface);color:var(--text)}
.sidebar-section{padding:10px 14px 3px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.nav{display:flex;flex-direction:column;gap:1px;padding:3px 7px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);color:var(--text2);font-size:13.5px;border:none;background:none;width:100%;text-align:left;transition:all .15s;cursor:pointer}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--accent2)}
.sidebar-bottom{margin-top:auto;padding:10px 7px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.gist-status{padding:7px 10px;border-radius:var(--r);font-size:12px;display:flex;align-items:center;gap:6px}
.gist-status.connected{background:rgba(16,185,129,.1);color:var(--done)}
.gist-status.disconnected{background:rgba(100,116,139,.1);color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.ok{background:var(--done)}
.sync-dot.syncing{background:var(--doing);animation:pulse .8s ease-in-out infinite}
.sync-dot.err{background:var(--danger)}
.sidebar-btn{width:100%;padding:7px 10px;border-radius:var(--r);border:1px solid var(--border2);background:none;color:var(--text2);font-size:12.5px;transition:all .15s;text-align:left}
.sidebar-btn:hover{background:var(--surface);color:var(--text)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:-.4px;flex:1}
.view-toggle{display:flex;background:var(--bg3);border-radius:var(--r);padding:3px;gap:2px}
.vt-btn{padding:5px 13px;border:none;border-radius:6px;font-size:12.5px;cursor:pointer;background:none;color:var(--text3);transition:all .15s}
.vt-btn.active{background:var(--surface2);color:var(--text)}

/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-danger{background:none;color:var(--danger);border:1px solid rgba(239,68,68,.25)}.btn-danger:hover{background:rgba(239,68,68,.1)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{background:none;border:none;color:var(--text3);padding:4px 6px;border-radius:5px;font-size:13px;transition:all .15s}
.btn-icon:hover{background:var(--surface);color:var(--text)}

/* ── Filter bar ── */
.filterbar{display:flex;align-items:flex-start;gap:12px;padding:8px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;background:var(--bg)}
.fg{display:flex;flex-direction:column;gap:3px}
.fl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.filter-date-wrap{position:relative}
.filter-date-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:5px 9px;color:var(--text);font-size:12.5px;width:108px;cursor:pointer}
.filter-date-input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}
.chip{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;cursor:pointer;border:1px solid;background:transparent;transition:all .15s;white-space:nowrap}
.fdiv{width:1px;background:var(--border);height:32px;align-self:center}
.clear-btn{font-size:11.5px;color:var(--text3);background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:4px}
.date-clear-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;padding:2px 5px;border-radius:4px;line-height:1;opacity:.6}
.date-clear-btn:hover{opacity:1;color:var(--danger);background:rgba(239,68,68,.08)}
.clear-btn:hover{color:var(--text2);background:var(--surface)}

/* ── Page content ── */
.page-content{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column}

/* ── Gantt ── */
.gantt-wrap{flex:1;overflow:auto;position:relative}
.gantt-inner{display:flex;flex-direction:column;min-width:max-content}

/* Sticky header */
.gantt-head-row{display:flex;position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:1px solid var(--border2)}
.gantt-frozen{display:flex;flex-shrink:0;position:sticky;left:0;z-index:31;background:var(--bg2);border-right:2px solid var(--border2)}
.gantt-frozen-sprint{width:90px;border-right:1px solid var(--border2)}
.gantt-frozen-label{width:210px}
.gantt-frozen-resource{width:90px;border-right:1px solid var(--border2)}
.gantt-head-label{padding:0 12px;display:flex;align-items:flex-end;padding-bottom:4px}
.gantt-head-label-text{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.gantt-scroll-head{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gantt-months-row{height:18px;display:flex;position:relative}
.gantt-month{position:absolute;top:0;height:18px;display:flex;align-items:center;padding-left:6px;font-size:9.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;border-right:2px solid var(--border2)}
.g-col.month-start{border-left:2px solid var(--border2)!important}
.gantt-day-cell.month-start{border-left:2px solid var(--border2)!important}
.gantt-days-row{display:flex;height:24px}
.gantt-day-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--border);flex-shrink:0;line-height:1.1}
.gantt-day-cell.we{background:var(--we-bg)}
.gantt-day-cell.holiday{background:var(--holiday-bg)}
.gantt-day-cell.today{background:rgba(99,102,241,.15)}
.gantt-day-name{font-size:8.5px;color:var(--text3);font-weight:500}
.gantt-day-num{font-size:10px;color:var(--text3);font-weight:500}
.gantt-day-cell.today .gantt-day-num{color:var(--accent2);font-weight:700}

/* Gantt rows */
.gantt-body-row{display:flex;border-bottom:1px solid var(--row-line);min-width:max-content}
.gantt-body-row:hover .gantt-frozen-body{filter:brightness(1.05)}
.gantt-frozen-body{display:flex;flex-shrink:0;position:sticky;left:0;z-index:10;background:var(--frozen-bg);border-right:2px solid var(--frozen-border);transition:background .1s}
.gantt-frozen-sprint-cell{width:90px;border-right:1px solid var(--border2);padding:0 8px;display:flex;align-items:center;overflow:hidden}
.gantt-frozen-label-cell{width:210px;padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.gantt-sprint-text{font-size:10.5px;color:var(--frozen-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}

/* Project row */
.gantt-proj-row .gantt-frozen-body{background:var(--frozen-bg)!important}
.gantt-proj-row .gantt-frozen-sprint-cell{background:var(--frozen-bg)}
.gantt-proj-row .gantt-frozen-label-cell{background:var(--frozen-bg);flex-direction:row;align-items:center;gap:7px}
.proj-collapse-btn{background:none;border:none;color:var(--text3);font-size:11px;padding:2px 4px;border-radius:4px;cursor:pointer;flex-shrink:0;transition:transform .15s}
.proj-collapse-btn.open{transform:rotate(0deg)}
.proj-collapse-btn.closed{transform:rotate(-90deg)}
.g-proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.g-proj-name{font-size:11.5px;font-weight:600;color:var(--frozen-text);text-transform:uppercase;letter-spacing:.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-task-count{font-size:10px;color:var(--text3);flex-shrink:0}

/* Sprint row */
.gantt-sprint-row .gantt-frozen-body{background:var(--sprint-row-bg)!important}
.gantt-sprint-row .gantt-frozen-sprint-cell{background:var(--sprint-row-bg)}
.gantt-sprint-row .gantt-frozen-label-cell{background:var(--sprint-row-bg);flex-direction:row;align-items:center;gap:6px}
.sprint-collapse-btn{background:none;border:none;color:var(--text3);font-size:10px;padding:2px 4px;border-radius:4px;cursor:pointer;flex-shrink:0;transition:transform .15s}
.sprint-collapse-btn.open{transform:rotate(0)}
.sprint-collapse-btn.closed{transform:rotate(-90deg)}
.g-sprint-name{font-size:11px;font-weight:600;color:var(--sprint-row-text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Task row */
.gantt-task-row{height:38px;border-bottom:1px solid var(--row-line)}
.gantt-proj-row{border-bottom:2px solid var(--frozen-border)!important}
.gantt-sprint-row{border-bottom:1px solid var(--frozen-border)!important}
.gantt-task-row .gantt-frozen-label-cell{flex-direction:column;justify-content:center}
.gantt-frozen-resource-cell{width:90px;border-right:1px solid var(--border2);padding:0 8px;display:flex;align-items:center;overflow:hidden;background:var(--frozen-bg,var(--bg))}
.g-resource-chip{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid;font-weight:500;display:inline-block;line-height:1.5}
.g-task-title{font-size:11.5px;color:var(--frozen-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;opacity:.85}

/* Gantt track */
.gantt-track-cell{flex:1;position:relative;overflow:visible}
.gantt-track-inner{position:relative;height:100%}
.g-col{position:absolute;top:0;bottom:0;border-right:1px solid var(--border);pointer-events:none}
.g-col.we{background:var(--we-bg)}
.g-col.holiday{background:var(--holiday-bg)}
.g-col.today{border-right:2px solid var(--today-line)}

/* Gantt bar */
.g-bar{position:absolute;top:5px;height:28px;border-radius:5px;display:flex;align-items:center;padding:0 8px;cursor:grab;user-select:none;z-index:2;transition:opacity .1s;opacity:.85}
.g-bar:hover{opacity:1;z-index:5}
.g-bar.dragging{opacity:.7;cursor:grabbing;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.g-bar-left-handle{position:absolute;left:0;top:0;bottom:0;width:7px;cursor:ew-resize;border-radius:5px 0 0 5px;background:rgba(0,0,0,.2)}
.g-bar-right-handle{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;border-radius:0 5px 5px 0;background:rgba(0,0,0,.2)}
.g-bar-text{font-size:11px;color:rgba(255,255,255,.92);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;pointer-events:none}
.g-bar-md{font-size:9.5px;color:rgba(255,255,255,.65);margin-left:4px;flex-shrink:0;font-family:var(--mono);pointer-events:none}
.g-bar-actions{display:none;position:absolute;top:-26px;right:0;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:3px;gap:2px;z-index:30}
.g-bar:hover .g-bar-actions{display:flex}
.g-bar-action-btn{background:none;border:none;padding:3px 6px;border-radius:4px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap}
.g-bar-action-btn:hover{background:var(--surface);color:var(--text)}

/* Row reorder drag handle */
.g-row-drag-handle{font-size:13px;color:var(--text3);cursor:grab;padding:0 4px 0 2px;flex-shrink:0;user-select:none;opacity:.5;line-height:1}
.g-row-drag-handle:hover{opacity:1;color:var(--text2)}
.gantt-task-row.row-dragging{opacity:.4}
.gantt-task-row.row-drag-over-top{border-top:2px solid var(--accent)!important}
.gantt-task-row.row-drag-over-bottom{border-bottom:2px solid var(--accent)!important}

/* Today line */
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today-line);opacity:.6;pointer-events:none;z-index:8}

/* ── Resource Grid ── */
.rg-wrap{flex:1;overflow:auto;position:relative}
.rg-inner{min-width:max-content;display:flex;flex-direction:column}
.rg-header{display:flex;position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--border2)}
.rg-frozen-head{flex-shrink:0;width:150px;position:sticky;left:0;z-index:21;background:var(--bg2);border-right:2px solid var(--border2);padding:6px 12px;display:flex;align-items:flex-end;padding-bottom:4px}
.rg-frozen-text{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}
.rg-dates-wrap{display:flex;flex-direction:column}
.rg-week-row{display:flex;height:18px;border-bottom:1px solid var(--border)}
.rg-week{display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text3);border-right:1px solid var(--border2)}
.rg-day-row{display:flex;height:26px}
.rg-day-h{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--border);font-size:8.5px;color:var(--text3);flex-shrink:0;line-height:1.1}
.rg-day-h.we{background:var(--we-bg)}
.rg-day-h.holiday{background:var(--holiday-bg)}
.rg-day-h.today{background:rgba(99,102,241,.15)}
.rg-day-h.month-start{border-left:2px solid var(--border2)!important}
.rg-cell.month-start{border-left:2px solid var(--border2)!important}
.rg-day-h-name{font-size:8px;font-weight:500}
.rg-day-h-num{font-size:10px;font-weight:500}
.rg-day-h.today .rg-day-h-num{color:var(--accent2);font-weight:700}

.rg-resource-row{display:flex;border-bottom:1px solid var(--border)}
.rg-frozen-cell{flex-shrink:0;width:150px;position:sticky;left:0;z-index:5;background:var(--bg);border-right:2px solid var(--border2);padding:6px 12px;display:flex;align-items:center;gap:8px}
.rg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rg-name{font-size:12.5px;font-weight:500;color:var(--text)}
.rg-role{font-size:10.5px;color:var(--text3)}
.rg-cells-row{display:flex}
.rg-cell{flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 1px;cursor:pointer;transition:background .1s;min-height:52px;position:relative}
.rg-cell:hover:not(.we){background:var(--surface)}
.rg-cell.we{background:var(--we-bg);cursor:default}
.rg-cell.holiday{background:var(--holiday-bg);cursor:default}
.rg-cell.overloaded{background:rgba(239,68,68,.06)}
.rg-cell-chips{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.rg-chip{height:5px;border-radius:3px;opacity:.85;width:calc(100% - 4px)}
.rg-cell-md{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:2px;text-align:center;line-height:1.2}
.rg-cell-md.over{color:var(--danger);font-weight:600}
.rg-warn{position:absolute;top:2px;right:2px;font-size:10px;line-height:1}
.rg-empty-dot{width:4px;height:4px;border-radius:50%;background:var(--border2)}

/* ── Lists pages ── */
.list-page{padding:18px;overflow:auto;flex:1}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:20px}
.list-group-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;margin-top:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);display:flex;align-items:stretch;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--border2)}
.card-accent{width:4px;flex-shrink:0}
.card-body{flex:1;padding:9px 12px}
.card-name{font-size:13.5px;font-weight:500;color:var(--text)}
.card-desc{font-size:11.5px;color:var(--text3);margin-top:1px}
.card-actions{display:flex;align-items:center;gap:3px;padding:0 7px}
.icon-btn{padding:4px 8px;border:none;border-radius:6px;font-size:11.5px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.del{color:var(--danger)}.icon-btn.del:hover{background:rgba(239,68,68,.1)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:520px;max-width:96vw;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.modal-title{font-size:15px;font-weight:600;letter-spacing:-.3px}
.modal-x{background:none;border:none;color:var(--text3);font-size:16px;padding:3px 7px;border-radius:4px;cursor:pointer}
.modal-x:hover{background:var(--surface);color:var(--text)}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:13px}
.fg2{display:flex;flex-direction:column;gap:5px}
.fg2 label{font-size:11.5px;font-weight:500;color:var(--text2)}
.fg2 input,.fg2 select,.fg2 textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;color:var(--text);transition:border-color .15s;width:100%}
.fg2 input:focus,.fg2 select:focus,.fg2 textarea:focus{outline:none;border-color:var(--accent)}
.fg2 select option{background:var(--bg3)}
.fg2 textarea{resize:vertical;min-height:52px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

// ═══════════════════════════════════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════════════════════════════════
function toISO(d){ // Date → 'YYYY-MM-DD'
  return d.toISOString().slice(0,10)
}
function parseISO(s){ // 'YYYY-MM-DD' → Date (local midnight)
  const [y,m,d] = s.split('-').map(Number)
  return new Date(y,m-1,d)
}
function parseDMY(s){ // 'DD/MM/YYYY' → Date
  const parts = s.trim().split('/')
  if(parts.length!==3) return null
  const [d,m,y] = parts.map(Number)
  if(!d||!m||!y||y<2000) return null
  return new Date(y,m-1,d)
}
function fmtDMY(isoOrDate){ // → 'DD/MM/YYYY'
  const d = typeof isoOrDate==='string' ? parseISO(isoOrDate) : isoOrDate
  if(!d||isNaN(d)) return ''
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()
}
function isoToday(){ return toISO(new Date()) }

function isWeekend(isoDate){
  const d = new Date(isoDate+'T00:00:00')
  return d.getDay()===0||d.getDay()===6
}
function isHoliday(isoDate){
  return DB.holidays.some(h=>h.date===isoDate)
}
function isNonWorkday(isoDate){ return isWeekend(isoDate)||isHoliday(isoDate) }

// Add N work-hours to startDate → endDate (ISO)
// 1 manday = 8 hours
function calcEndDate(startISO, manday){
  let remaining = Math.round(manday * 8) // hours
  let cur = parseISO(startISO)
  if(isNonWorkday(toISO(cur))){
    // advance to first workday
    while(isNonWorkday(toISO(cur))) cur.setDate(cur.getDate()+1)
  }
  while(remaining > 0){
    if(!isNonWorkday(toISO(cur))){
      remaining -= 8
      if(remaining > 0) cur.setDate(cur.getDate()+1)
      // find next workday
      while(remaining > 0 && isNonWorkday(toISO(cur))) cur.setDate(cur.getDate()+1)
    } else {
      cur.setDate(cur.getDate()+1)
    }
  }
  return toISO(cur)
}

// Count work-manday between start and end (inclusive)
function calcManday(startISO, endISO){
  let count = 0
  const cur = parseISO(startISO)
  const end = parseISO(endISO)
  while(cur <= end){
    if(!isNonWorkday(toISO(cur))) count++
    cur.setDate(cur.getDate()+1)
  }
  return count
}

function getDays(start,end){
  const days=[], cur=parseISO(start), last=parseISO(end)
  while(cur<=last){ days.push(toISO(cur)); cur.setDate(cur.getDate()+1) }
  return days
}
function dayDiff(a,b){
  return Math.round((parseISO(b)-parseISO(a))/86400000)
}

// Get range covering all tasks (+ padding)
function getFullRange(){
  const tasks = DB.tasks
  if(!tasks.length) return { start: isoToday(), end: isoToday() }
  let min=tasks[0].startDate, max=tasks[0].endDate
  for(const t of tasks){
    if(t.startDate<min) min=t.startDate
    if(t.endDate>max) max=t.endDate
  }
  // pad 7 days each side
  const s = parseISO(min); s.setDate(s.getDate()-7)
  const e = parseISO(max); e.setDate(e.getDate()+14)
  return { start:toISO(s), end:toISO(e) }
}
function getEffectiveRange(){
  if(filters.startDate && filters.endDate) return { start:filters.startDate, end:filters.endDate }
  return getFullRange()
}

// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
function initTheme(){
  const saved = localStorage.getItem('senna_theme')
  if(saved){ applyTheme(saved); return }
  const sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  applyTheme(sys)
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme)
  localStorage.setItem('senna_theme', theme)
  const btn = document.getElementById('theme-toggle-btn')
  if(btn) btn.textContent = theme==='dark' ? '☀️' : '🌙'
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
  applyTheme(cur==='dark' ? 'light' : 'dark')
}

// ═══════════════════════════════════════════════════════════════════
// STORAGE / GIST
// ═══════════════════════════════════════════════════════════════════
function saveLocal(){ localStorage.setItem('senna_db', JSON.stringify(DB)) }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function setSyncing(v){
  const dot = document.getElementById('sync-dot')
  if(dot) dot.className='sync-dot '+(v?'syncing':(GIST.id?'ok':''))
}
function updateGistUI(){
  const box=document.getElementById('gist-status-box')
  const txt=document.getElementById('gist-status-text')
  const dot=document.getElementById('sync-dot')
  if(!box) return
  if(GIST.id){
    box.className='gist-status connected'
    txt.textContent='Gist: '+GIST.id.slice(0,8)+'…'
    dot.className='sync-dot ok'
  } else {
    box.className='gist-status disconnected'
    txt.textContent='Not connected'
    dot.className='sync-dot'
  }
}
async function syncFromGist(){
  if(!GIST.id||!GIST.token) return
  setSyncing(true)
  try{
    const res=await fetch(`https://api.github.com/gists/${GIST.id}`,{
      headers:{Authorization:`Bearer ${GIST.token}`,Accept:'application/vnd.github+json'}
    })
    if(!res.ok) throw new Error('Status '+res.status)
    const data=await res.json()
    const content=data.files['senna-db.json']?.content
    if(content){ DB=JSON.parse(content); saveLocal(); toast('Synced ✓','ok'); render() }
  }catch(e){ toast('Sync failed: '+e.message,'err') }
  setSyncing(false)
}
async function pushToGist(){
  if(!GIST.id||!GIST.token) return
  setSyncing(true)
  try{
    const res=await fetch(`https://api.github.com/gists/${GIST.id}`,{
      method:'PATCH',
      headers:{Authorization:`Bearer ${GIST.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({files:{'senna-db.json':{content:JSON.stringify(DB,null,2)}}})
    })
    if(!res.ok) throw new Error('Status '+res.status)
  }catch(e){ toast('Push failed: '+e.message,'err') }
  setSyncing(false)
}
async function saveDB(){ saveLocal(); if(GIST.id&&GIST.token) await pushToGist() }

function getFilteredTasks(){
  const {start,end}=getEffectiveRange()
  let tasks=DB.tasks.filter(t=>t.endDate>=start&&t.startDate<=end)
  if(filters.projectIds.length) tasks=tasks.filter(t=>filters.projectIds.includes(t.projectId))
  if(filters.resourceIds.length) tasks=tasks.filter(t=>filters.resourceIds.includes(t.resourceId))
  if(filters.statuses.length) tasks=tasks.filter(t=>filters.statuses.includes(t.status))
  return tasks
}

// ═══════════════════════════════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════════════════════════════
function render(){
  const main=document.getElementById('main-area')
  if(!main) return
  if(currentPage==='timeline'){
    const wrap=document.getElementById('gantt-wrap')||document.querySelector('.rg-wrap')
    if(wrap) _savedScrollX=wrap.scrollLeft
  }
  if(currentPage==='timeline') main.innerHTML=renderTimeline()
  else if(currentPage==='projects') main.innerHTML=renderProjectsPage()
  else if(currentPage==='resources') main.innerHTML=renderResourcesPage()
  afterRender()
}

function afterRender(){
  if(currentPage==='timeline'){
    if(currentView==='gantt') initGanttDrag()
    if(_savedScrollX!==null){
      setTimeout(()=>{
        const wrap=document.getElementById('gantt-wrap')||document.querySelector('.rg-wrap')
        if(wrap) wrap.scrollLeft=_savedScrollX
        _savedScrollX=null
      },0)
    } else { scrollToToday() }
  }
}

// GANTT RENDER
// ═══════════════════════════════════════════════════════════════════
function renderGantt(){
  const {start,end}=getEffectiveRange()
  const days=getDays(start,end)
  const today=isoToday()
  const projMap=Object.fromEntries(DB.projects.map(p=>[p.id,p]))
  const resMap=Object.fromEntries(DB.resources.map(r=>[r.id,r]))
  const tasks=getFilteredTasks()
  const totalW=days.length*DAY_W

  // Build month labels
  let months=[],prev='',mStart=0,mCnt=0
  days.forEach((d,i)=>{
    const mk=d.slice(0,7)
    if(mk!==prev){if(prev)months.push({label:prev,width:mCnt*DAY_W,left:mStart});prev=mk;mStart=i*DAY_W;mCnt=0}
    mCnt++
  })
  if(prev)months.push({label:prev,width:mCnt*DAY_W,left:mStart})

  const DOW=['Su','M','Tu','W','Th','F','Sa']
  const statusColors={'Done':'var(--done)','Doing':'var(--doing)','To do':'var(--todo)'}

  // Group: project → sprint → tasks
  const projOrder=DB.projects.map(p=>p.id).filter(pid=>tasks.some(t=>t.projectId===pid))
  const grouped={}
  for(const pid of projOrder){
    grouped[pid]={}
    const ptasks=tasks.filter(t=>t.projectId===pid)
    for(const t of ptasks){
      const sp=t.sprint||'(No Sprint)'
      if(!grouped[pid][sp]) grouped[pid][sp]=[]
      grouped[pid][sp].push(t)
    }
  }

  // Today offset
  const todayOffset=dayDiff(start,today)

  // Render rows
  let rows=''
  for(const pid of projOrder){
    const proj=projMap[pid]||{name:'?',color:'#888'}
    const projCollapsed=collapseState['p:'+pid]
    const ptaskCount=tasks.filter(t=>t.projectId===pid).length
    // Project row
    rows+=`<div class="gantt-body-row gantt-proj-row" style="height:32px">
      <div class="gantt-frozen-body" style="background:var(--bg2)">
        <div class="gantt-frozen-sprint-cell" style="background:var(--bg2)"></div>
        <div class="gantt-frozen-label-cell" style="background:var(--bg2)">
          <button class="proj-collapse-btn ${projCollapsed?'closed':'open'}" onclick="toggleCollapse('p:${pid}')">▼</button>
          <div class="g-proj-dot" style="background:${proj.color}"></div>
          <span class="g-proj-name">${esc(proj.name)}</span>
          <span class="proj-task-count">${ptaskCount}</span>
        </div>
        <div class="gantt-frozen-resource-cell" style="background:var(--bg2)"></div>
      </div>
      <div class="gantt-track-cell"><div class="gantt-track-inner" style="width:${totalW}px;height:32px;border-top:3px solid ${proj.color}20;background:${proj.color}08">
        ${days.map((d,i)=>{const fom=new Date(d+'T00:00:00').getDate()===1;return `<div class="g-col${isNonWorkday(d)?(isHoliday(d)?' holiday':' we'):''}${d===today?' today':''}${fom?' month-start':''}" style="left:${i*DAY_W}px;width:${DAY_W}px"></div>`}).join('')}
      </div></div>
    </div>`

    if(projCollapsed) continue

    const sprints=Object.keys(grouped[pid])
    for(const sp of sprints){
      const spKey=`sp:${pid}:${sp}`
      const spCollapsed=collapseState[spKey]
      const spTasks=grouped[pid][sp]
      // Sprint row
      rows+=`<div class="gantt-body-row gantt-sprint-row" style="height:28px">
        <div class="gantt-frozen-body" style="background:var(--surface)">
          <div class="gantt-frozen-sprint-cell" style="background:var(--surface)"></div>
          <div class="gantt-frozen-label-cell" style="background:var(--surface)">
            <button class="sprint-collapse-btn ${spCollapsed?'closed':'open'}" onclick="toggleCollapse('${spKey}')">▶</button>
            <span class="g-sprint-name">${esc(sp)}</span>
          </div>
          <div class="gantt-frozen-resource-cell" style="background:var(--surface)"></div>
        </div>
        <div class="gantt-track-cell"><div class="gantt-track-inner" style="width:${totalW}px;height:28px">
          ${days.map((d,i)=>{const fom=new Date(d+'T00:00:00').getDate()===1;return `<div class="g-col${isNonWorkday(d)?(isHoliday(d)?' holiday':' we'):''}${d===today?' today':''}${fom?' month-start':''}" style="left:${i*DAY_W}px;width:${DAY_W}px"></div>`}).join('')}
        </div></div>
      </div>`

      if(spCollapsed) continue

      for(const t of spTasks){
        const res=resMap[t.resourceId]||{name:'?',color:'#64748b'}
        const offset=Math.max(0,dayDiff(start,t.startDate))
        const dur=Math.max(1,dayDiff(t.startDate,t.endDate)+1)
        const barL=offset*DAY_W
        const barW=Math.max(dur*DAY_W-2,DAY_W-2)
        rows+=`<div class="gantt-body-row gantt-task-row" data-taskid="${t.id}">
          <div class="gantt-frozen-body" style="background:var(--surface)">
            <div class="gantt-frozen-sprint-cell" style="background:#fffbe6">
              <span class="g-row-drag-handle" data-rowtaskid="${t.id}" title="Drag to reorder">⠿</span>
              <span class="gantt-sprint-text">${esc(t.sprint||'')}</span>
            </div>
            <div class="gantt-frozen-label-cell" style="background:#fffbe6;border-left:3px solid ${proj.color}50">
              <span class="g-task-title" style="opacity:1">${esc(t.title)}</span>
            </div>
            <div class="gantt-frozen-resource-cell" style="background:#fffbe6">
              <span class="g-resource-chip" style="border-color:${res.color||'#64748b'};color:${res.color||'#64748b'};background:${res.color||'#64748b'}18">${esc(res.name)}</span>
            </div>
          </div>
          <div class="gantt-track-cell"><div class="gantt-track-inner" style="width:${totalW}px;height:38px">
            ${days.map((d,i)=>{const fom=new Date(d+'T00:00:00').getDate()===1;return `<div class="g-col${isNonWorkday(d)?(isHoliday(d)?' holiday':' we'):''}${d===today?' today':''}${fom?' month-start':''}" style="left:${i*DAY_W}px;width:${DAY_W}px"></div>`}).join('')}
            <div class="g-bar" data-taskid="${t.id}"
              style="left:${barL}px;width:${barW}px;background:${proj.color};border-left:3px solid ${statusColors[t.status]}"
              data-start="${t.startDate}" data-end="${t.endDate}" data-offset="${offset}" data-dur="${dur}">
              <div class="g-bar-left-handle" data-handle="left" data-taskid="${t.id}"></div>
              <span class="g-bar-text">${esc(t.title)}</span>
              <span class="g-bar-md">${t.manday}d</span>
              <div class="g-bar-right-handle" data-handle="right" data-taskid="${t.id}"></div>
              <div class="g-bar-actions">
                <button class="g-bar-action-btn" onclick="openTaskModal('${t.id}');event.stopPropagation()">✏ Edit</button>
                <button class="g-bar-action-btn" onclick="duplicateTask('${t.id}');event.stopPropagation()">⧉ Dupe</button>
                <button class="g-bar-action-btn" style="color:var(--danger)" onclick="deleteTaskDirect('${t.id}');event.stopPropagation()">✕ Del</button>
              </div>
            </div>
          </div></div>
        </div>`
      }
    }
  }

  // Today line position
  const todayLine = todayOffset>=0&&todayOffset<=days.length ?
    `<div class="today-line" id="today-line" style="left:${300+todayOffset*DAY_W}px;top:0;height:100%"></div>` : ''

  return `<div class="gantt-wrap" id="gantt-wrap">
    <div class="gantt-inner" id="gantt-inner">
      <!-- Header -->
      <div class="gantt-head-row">
        <div class="gantt-frozen" style="z-index:31">
          <div class="gantt-frozen-sprint gantt-head-label">
            <span class="gantt-head-label-text">Sprint</span>
          </div>
          <div class="gantt-frozen-label gantt-head-label">
            <span class="gantt-head-label-text">Project / Task</span>
          </div>
          <div class="gantt-frozen-resource gantt-head-label">
            <span class="gantt-head-label-text">Resource</span>
          </div>
        </div>
        <div class="gantt-scroll-head">
          <div class="gantt-months-row" style="width:${totalW}px">
            ${months.map(m=>`<div class="gantt-month" style="width:${m.width}px;left:${m.left}px">${new Date(m.label+'-01').toLocaleString('en',{month:'short',year:'2-digit'})}</div>`).join('')}
          </div>
          <div class="gantt-days-row" style="width:${totalW}px">
            ${days.map(d=>{
              const dt=new Date(d+'T00:00:00')
              const we=isWeekend(d), hol=isHoliday(d), tod=d===today
              return `<div class="gantt-day-cell${we?' we':''}${hol?' holiday':''}${tod?' today':''}" style="width:${DAY_W}px">
                <span class="gantt-day-name">${DOW[dt.getDay()]}</span>
                <span class="gantt-day-num">${dt.getDate()}</span>
              </div>`
            }).join('')}
          </div>
        </div>
      </div>
      <!-- Body -->
      <div id="gantt-body" style="position:relative">
        ${rows}
      </div>
    </div>
  </div>`
}

// SCROLL TO TODAY
// ═══════════════════════════════════════════════════════════════════
function scrollToToday(){
  setTimeout(()=>{
    const wrap=document.getElementById('gantt-wrap')||document.querySelector('.rg-wrap')
    if(!wrap) return
    const {start}=getEffectiveRange()
    const offset=dayDiff(start,isoToday())
    const FROZEN_W=340 // sprint + label + resource
    const scrollX=Math.max(0,(offset*DAY_W)-wrap.clientWidth/2+FROZEN_W)
    wrap.scrollLeft=scrollX
  },50)
}

// ═══════════════════════════════════════════════════════════════════
// DRAG & RESIZE
// ═══════════════════════════════════════════════════════════════════
function initGanttDrag(){
  const wrap=document.getElementById('gantt-wrap')
  if(!wrap) return
  let drag=null
  let rowDrag=null
  function getTaskById(id){ return DB.tasks.find(t=>t.id===id) }

  wrap.addEventListener('mousedown', e=>{
    const rowHandle=e.target.closest('[data-rowtaskid]')
    if(rowHandle){
      e.preventDefault()
      const taskId=rowHandle.dataset.rowtaskid
      const sourceRow=rowHandle.closest('.gantt-task-row')
      rowDrag={taskId,sourceRow,lastOverRow:null,lastPos:null}
      sourceRow.classList.add('row-dragging')
      document.body.style.cursor='grabbing'
      return
    }
    const handle=e.target.closest('[data-handle]')
    const bar=e.target.closest('.g-bar')
    if(!bar) return
    const taskId=bar.dataset.taskid
    const t=getTaskById(taskId)
    if(!t) return
    e.preventDefault()
    const {start}=getEffectiveRange()
    const type=handle?handle.dataset.handle:'move'
    drag={type,taskId,bar,startX:e.clientX,origStart:t.startDate,origEnd:t.endDate,
          origL:parseInt(bar.style.left)||0,origW:parseInt(bar.style.width)||DAY_W,rangeStart:start}
    bar.classList.add('dragging')
    document.body.style.cursor=type==='move'?'grabbing':'ew-resize'
  })

  document.addEventListener('mousemove', e=>{
    if(rowDrag){
      if(rowDrag.lastOverRow) rowDrag.lastOverRow.classList.remove('row-drag-over-top','row-drag-over-bottom')
      const overEl=document.elementFromPoint(e.clientX,e.clientY)
      const overRow=overEl?.closest('.gantt-task-row')
      if(overRow&&overRow!==rowDrag.sourceRow){
        const rect=overRow.getBoundingClientRect()
        const pos=e.clientY<rect.top+rect.height/2?'top':'bottom'
        overRow.classList.add(pos==='top'?'row-drag-over-top':'row-drag-over-bottom')
        rowDrag.lastOverRow=overRow; rowDrag.lastPos=pos
      } else { rowDrag.lastOverRow=null; rowDrag.lastPos=null }
      return
    }
    if(!drag) return
    const dx=e.clientX-drag.startX
    const daysDelta=Math.round(dx/DAY_W)
    const {start}=getEffectiveRange()
    const t=getTaskById(drag.taskId)
    if(!t) return
    if(drag.type==='move'){
      const newOffset=Math.max(0,drag.origL+daysDelta*DAY_W)
      drag.bar.style.left=newOffset+'px'
      const newStart=addDays(start,Math.round(newOffset/DAY_W))
      const dur=dayDiff(drag.origStart,drag.origEnd)
      drag.bar.querySelector('.g-bar-md').textContent=calcManday(newStart,addDays(newStart,dur))+'d'
    } else if(drag.type==='right'){
      const newW=Math.max(DAY_W,drag.origW+daysDelta*DAY_W)
      drag.bar.style.width=newW+'px'
      const offset=Math.round((parseInt(drag.bar.style.left)||0)/DAY_W)
      const newStart=addDays(start,offset)
      drag.bar.querySelector('.g-bar-md').textContent=calcManday(newStart,addDays(newStart,Math.round(newW/DAY_W)-1))+'d'
    } else if(drag.type==='left'){
      const newL=Math.max(0,drag.origL+daysDelta*DAY_W)
      const newW=Math.max(DAY_W,drag.origW+(-daysDelta*DAY_W))
      drag.bar.style.left=newL+'px'; drag.bar.style.width=newW+'px'
      const newStart=addDays(start,Math.round(newL/DAY_W))
      const newEnd=addDays(start,Math.round((drag.origL+drag.origW)/DAY_W)-1)
      drag.bar.querySelector('.g-bar-md').textContent=calcManday(newStart,newEnd)+'d'
    }
  })

  document.addEventListener('mouseup', async e=>{
    if(rowDrag){
      const {taskId,sourceRow,lastOverRow,lastPos}=rowDrag
      sourceRow.classList.remove('row-dragging')
      document.body.style.cursor=''
      if(lastOverRow) lastOverRow.classList.remove('row-drag-over-top','row-drag-over-bottom')
      rowDrag=null
      if(lastOverRow&&lastPos){
        const targetTaskId=lastOverRow.dataset.taskid
        if(targetTaskId&&targetTaskId!==taskId){
          const srcIdx=DB.tasks.findIndex(t=>t.id===taskId)
          const tgtIdx=DB.tasks.findIndex(t=>t.id===targetTaskId)
          if(srcIdx>-1&&tgtIdx>-1){
            const [removed]=DB.tasks.splice(srcIdx,1)
            const insertAt=lastPos==='top'?(tgtIdx>srcIdx?tgtIdx-1:tgtIdx):(tgtIdx>srcIdx?tgtIdx:tgtIdx+1)
            DB.tasks.splice(Math.max(0,insertAt),0,removed)
            DB.tasks.forEach((t,i)=>t.order=i)
            await saveDB(); render()
          }
        }
      }
      return
    }
    if(!drag) return
    const {bar,taskId,startX,origStart,origEnd,type}=drag
    bar.classList.remove('dragging'); document.body.style.cursor=''
    const daysDelta=Math.round((e.clientX-startX)/DAY_W)
    if(daysDelta!==0){
      const t=getTaskById(taskId)
      if(t){
        let newStart=origStart,newEnd=origEnd
        if(type==='move'){ newStart=shiftDate(origStart,daysDelta); newEnd=shiftDate(origEnd,daysDelta) }
        else if(type==='right'){ newEnd=shiftDate(origEnd,daysDelta); if(newEnd<newStart)newEnd=newStart }
        else if(type==='left'){ newStart=shiftDate(origStart,daysDelta); if(newStart>newEnd)newStart=newEnd }
        const newMd=calcManday(newStart,newEnd)
        const conflict=DB.tasks.some(ot=>ot.id!==taskId&&ot.resourceId===t.resourceId&&ot.startDate<=newEnd&&ot.endDate>=newStart)
        if(conflict) toast('⚠ Resource conflict on these dates','warn')
        t.startDate=newStart; t.endDate=newEnd; t.manday=newMd
        await saveDB(); render()
      }
    }
    drag=null
  })
}

function addDays(isoDate, n){
  const d=parseISO(isoDate); d.setDate(d.getDate()+n); return toISO(d)
}
function shiftDate(isoDate, days){
  const d=parseISO(isoDate); d.setDate(d.getDate()+days); return toISO(d)
}

// ═══════════════════════════════════════════════════════════════════
// RESOURCE GRID
// ═══════════════════════════════════════════════════════════════════
function renderResourceGrid(){
  const {start,end}=getEffectiveRange()
  const days=getDays(start,end)
  const today=isoToday()
  const projMap=Object.fromEntries(DB.projects.map(p=>[p.id,p]))
  const tasks=getFilteredTasks()
  const CELL_W=44
  const DOW=['Su','M','Tu','W','Th','F','Sa']

  // Build lookup: resourceId → date → [{task,projColor,mandayPerDay,projectId}]
  const lookup={}
  for(const t of tasks){
    const proj=projMap[t.projectId]
    if(!proj) continue
    const workDays=Math.max(1,calcManday(t.startDate,t.endDate))
    const mandayPerDay=Math.round((t.manday/workDays)*100)/100
    const tDays=getDays(
      t.startDate<start?start:t.startDate,
      t.endDate>end?end:t.endDate
    )
    for(const d of tDays){
      if(isNonWorkday(d)) continue
      const k=t.resourceId+'__'+d
      if(!lookup[k]) lookup[k]=[]
      lookup[k].push({task:t,projColor:proj.color,manday:mandayPerDay,projectId:t.projectId})
    }
  }

  // Week groups
  let weeks=[],wk=[]
  for(const d of days){
    const dow=new Date(d+'T00:00:00').getDay()
    if(dow===1&&wk.length){weeks.push(wk);wk=[]}
    wk.push(d)
  }
  if(wk.length) weeks.push(wk)

  const ress=DB.resources.filter(r=>!filters.resourceIds.length||filters.resourceIds.includes(r.id))

  return `<div class="rg-wrap">
    <div class="rg-inner">
      <div class="rg-header">
        <div class="rg-frozen-head"><span class="rg-frozen-text">Resource</span></div>
        <div class="rg-dates-wrap">
          <div class="rg-month-row" style="height:18px;display:flex;position:relative;width:${days.length*CELL_W}px">

          </div>
          <div class="rg-day-row">
            ${days.map(d=>{
              const dt=new Date(d+'T00:00:00')
              const we=isWeekend(d),hol=isHoliday(d),tod=d===today,fom=dt.getDate()===1
              return `<div class="rg-day-h${we?' we':''}${hol?' holiday':''}${tod?' today':''}${fom?' month-start':''}" style="width:${CELL_W}px">
                <span class="rg-day-h-name">${DOW[dt.getDay()]}</span>
                <span class="rg-day-h-num">${dt.getDate()}</span>
              </div>`
            }).join('')}

        </div>
      </div>
      ${ress.map(r=>`
      <div class="rg-resource-row">
        <div class="rg-frozen-cell">
          <div class="rg-dot" style="background:${r.color||'#64748b'}"></div>
          <div><div class="rg-name">${esc(r.name)}</div>${r.role?`<div class="rg-role">${r.role}</div>`:''}</div>
        </div>
        <div class="rg-cells-row">
          ${days.map(d=>{
            const we=isWeekend(d),hol=isHoliday(d),tod=d===today
            const items=lookup[r.id+'__'+d]||[]
            const totalMd=Math.round(items.reduce((s,x)=>s+Number(x.manday||0),0)*100)/100
            const uniqueProjects=new Set(items.map(x=>x.projectId)).size
            const over=uniqueProjects>1
            const mdParts=items.map(x=>x.manday).join('+')
            const title=items.map(x=>x.task.title+' ('+x.manday+'d)').join(', ')
            const fom2=new Date(d+'T00:00:00').getDate()===1; const cellClick=(!we&&!hol)?(' data-rid="'+r.id+'" data-date="'+d+'" onclick="openDayModal(this.dataset.rid,this.dataset.date)"'):''; return `<div class="rg-cell${we?' we':''}${hol?' holiday':''}${tod?' today':''}${over?' overloaded':''}${fom2?' month-start':''}" style="width:${CELL_W}px" title="${esc(title)}" ${cellClick}>
              ${items.length&&!we&&!hol?`
                <div class="rg-cell-chips">${items.slice(0,5).map(x=>`<div class="rg-chip" style="background:${x.projColor}"></div>`).join('')}</div>
                <div class="rg-cell-md${over?' over':''}">${mdParts}${items.length>1?`<br>=<b>${totalMd}d</b>`:''}</div>
                ${over?`<div class="rg-warn" title="${uniqueProjects} projects on this day">⚠</div>`:''}`
              :!we&&!hol?`<div class="rg-empty-dot"></div>`:''}
            </div>`
          }).join('')}
        </div>
      </div>`).join('')}
    </div>
  </div>`
}

function openDayModal(resourceId, dateISO){
  const res=DB.resources.find(r=>r.id===resourceId)
  if(!res) return
  const projMap=Object.fromEntries(DB.projects.map(p=>[p.id,p]))
  const dayTasks=DB.tasks.filter(t=>
    t.resourceId===resourceId &&
    t.startDate<=dateISO && t.endDate>=dateISO
  )
  const totalMd=dayTasks.reduce((s,t)=>s+Number(t.manday||0),0)
  const overloaded=totalMd>1
  const initials=res.name.slice(0,2)
  const taskRows=dayTasks.length===0
    ?'<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">No tasks on this day</div>'
    :dayTasks.map(t=>{
        const proj=projMap[t.projectId]||{name:'?',color:'#888'}
        const statusColor=t.status==='Done'?'var(--done)':t.status==='Doing'?'var(--doing)':'var(--text3)'
        const statusBg=t.status==='Done'?'rgba(16,185,129,.15)':t.status==='Doing'?'rgba(245,158,11,.15)':'rgba(71,85,105,.15)'
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:var(--r);margin-bottom:8px;border-left:3px solid '+proj.color+'">'
          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.title)+'</div>'
          +'<div style="font-size:11.5px;color:var(--text3);margin-top:2px"><span style="color:'+proj.color+';font-weight:500">'+esc(proj.name)+'</span>'+(t.sprint?' · '+esc(t.sprint):'')+'</div>'
          +'</div>'
          +'<div style="text-align:right;flex-shrink:0">'
          +'<div style="font-size:14px;font-weight:600;color:var(--text)">'+Number(t.manday).toFixed(2)+' MD</div>'
          +'<div style="font-size:10px;padding:2px 7px;border-radius:10px;margin-top:3px;background:'+statusBg+';color:'+statusColor+'">'+t.status+'</div>'
          +'</div></div>'
      }).join('')
  const html='<div class="modal-head"><div class="modal-title">'+fmtDMY(dateISO)+'</div><button class="modal-x" onclick="closeModal()">✕</button></div>'
    +'<div class="modal-body">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">'
    +'<div style="width:32px;height:32px;border-radius:50%;background:'+(res.color||'#64748b')+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px">'+initials+'</div>'
    +'<div><div style="font-size:14px;font-weight:600;color:var(--text)">'+esc(res.name)+'</div><div style="font-size:12px;color:var(--text3)">'+(res.role||'No role')+'</div></div>'
    +'<div style="margin-left:auto;text-align:right">'
    +'<div style="font-size:18px;font-weight:600;color:'+(overloaded?'var(--danger)':'var(--text)')+'">'+totalMd.toFixed(2)+' MD</div>'
    +'<div style="font-size:11px;color:var(--text3)">'+dayTasks.length+' task'+(dayTasks.length!==1?'s':'')+'</div>'
    +'</div></div>'
    +taskRows
    +'</div>'
  showModal(html)
}

// DATE PICKER COMPONENT
// ═══════════════════════════════════════════════════════════════════
let openDPId=null
const _dpCallbacks={}
function renderDatePicker(id, isoValue, minISO='', onChangeCb=''){
  const display=isoValue?fmtDMY(isoValue):''
  if(onChangeCb) _dpCallbacks[id]=onChangeCb
  return `<div class="dp-wrap" id="dpwrap-${id}">
    <input class="dp-input" id="dpinput-${id}" value="${display}" placeholder="dd/mm/yyyy" readonly
      onclick="toggleDP('${id}','${minISO}')">
    <div class="dp-popup hidden" id="dppop-${id}">
      <div class="dp-nav">
        <button class="dp-nav-btn" onclick="dpNav('${id}',-1)">‹</button>
        <span class="dp-month-year" id="dpmy-${id}"></span>
        <button class="dp-nav-btn" onclick="dpNav('${id}',1)">›</button>
      </div>
      <div class="dp-grid" id="dpgrid-${id}"></div>
      <div class="dp-manual-row">
        <input class="dp-manual-input" id="dpman-${id}" placeholder="dd/mm/yyyy" maxlength="10">
        <button class="dp-manual-btn" onclick="dpManualSet('${id}','${onChangeCb}')">OK</button>
      </div>
    </div>
  </div>`
}

const dpState={} // id → {year,month,isoValue,min,onChangeCb}

function toggleDP(id,min){
  const cb=_dpCallbacks[id]||''
  const pop=document.getElementById('dppop-'+id)
  if(!pop) return
  if(openDPId&&openDPId!==id){
    const prev=document.getElementById('dppop-'+openDPId)
    if(prev) prev.classList.add('hidden')
  }
  if(!pop.classList.contains('hidden')){ pop.classList.add('hidden'); openDPId=null; return }
  const inp=document.getElementById('dpinput-'+id)
  const cur=parseDMY(inp.value)||new Date()
  dpState[id]={year:cur.getFullYear(),month:cur.getMonth(),isoValue:toISO(cur),min:min||'',onChangeCb:_dpCallbacks[id]||''}
  pop.classList.remove('hidden')
  openDPId=id
  dpRender(id)
}
function dpNav(id,dir){
  if(!dpState[id]) return
  dpState[id].month+=dir
  if(dpState[id].month>11){dpState[id].month=0;dpState[id].year++}
  if(dpState[id].month<0){dpState[id].month=11;dpState[id].year--}
  dpRender(id)
}
function dpRender(id){
  const s=dpState[id]; if(!s) return
  const {year,month}=s
  const mLabel=new Date(year,month,1).toLocaleString('en',{month:'long',year:'numeric'})
  document.getElementById('dpmy-'+id).textContent=mLabel
  const today=isoToday()
  const grid=document.getElementById('dpgrid-'+id)
  const DOW=['Su','M','Tu','W','Th','F','Sa']
  let html=DOW.map(d=>`<div class="dp-dow">${d}</div>`).join('')
  const firstDay=new Date(year,month,1).getDay()
  const daysInMonth=new Date(year,month+1,0).getDate()
  const prevDays=new Date(year,month,0).getDate()
  for(let i=0;i<firstDay;i++){
    const d=prevDays-firstDay+1+i
    html+=`<button class="dp-day-btn other-month" disabled>${d}</button>`
  }
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const we=isWeekend(iso),hol=isHoliday(iso),tod=iso===today,sel=iso===s.isoValue
    html+=`<button class="dp-day-btn${we?' we':''}${hol?' holiday':''}${tod?' today':''}${sel?' selected':''}"
      onclick="dpSelect('${id}','${iso}')">${d}</button>`
  }
  grid.innerHTML=html
}
function dpSelect(id,iso){
  const s=dpState[id]; if(!s) return
  s.isoValue=iso
  const inp=document.getElementById('dpinput-'+id)
  inp.value=fmtDMY(iso)
  document.getElementById('dppop-'+id).classList.add('hidden')
  openDPId=null
  if(s.onChangeCb) evalDPCb(s.onChangeCb,iso)
  inp.dispatchEvent(new Event('change'))
}
function dpManualSet(id,cb){
  const man=document.getElementById('dpman-'+id)
  const d=parseDMY(man.value)
  if(!d){toast('Invalid date format (dd/mm/yyyy)','err');return}
  dpSelect(id,toISO(d))
}
function evalDPCb(cb,v){
  try{ new Function('v',cb)(v) }catch(e){}
}

// Close dropdown on outside click
document.addEventListener('mousedown',e=>{
  if(openDPId){
    const wrap=document.getElementById('dpwrap-'+openDPId)
    if(wrap&&!wrap.contains(e.target)){
      document.getElementById('dppop-'+openDPId)?.classList.add('hidden')
      openDPId=null
    }
  }
})

// COLOR PICKER COMPONENT
// ═══════════════════════════════════════════════════════════════════
function renderColorPicker(id,currentColor){
  return `<div class="color-picker-wrap" id="cp-${id}">
    <div class="color-swatches">
      ${COLORS.map(c=>`<div class="cp-swatch${currentColor===c?' on':''}" style="background:${c}"
        onclick="cpPick('${id}','${c}',this)" title="${c}"></div>`).join('')}
    </div>
    <div class="cp-custom-row">
      <div class="cp-preview" id="cp-preview-${id}" style="background:${currentColor||COLORS[0]}"></div>
      <input class="cp-hex-input" id="cp-hex-${id}" value="${currentColor||COLORS[0]}"
        placeholder="#rrggbb" oninput="cpHexInput('${id}',this.value)">
      <input type="color" class="cp-native" value="${currentColor||COLORS[0]}"
        oninput="cpNative('${id}',this.value)">
    </div>
  </div>`
}
function cpPick(id,color,el){
  document.querySelectorAll(`#cp-${id} .cp-swatch`).forEach(s=>s.classList.remove('on'))
  el.classList.add('on')
  document.getElementById('cp-preview-'+id).style.background=color
  document.getElementById('cp-hex-'+id).value=color
  document.querySelector(`#cp-${id} .cp-native`).value=color
}
function cpHexInput(id,val){
  if(/^#[0-9a-fA-F]{6}$/.test(val)){
    document.getElementById('cp-preview-'+id).style.background=val
    document.querySelectorAll(`#cp-${id} .cp-swatch`).forEach(s=>s.classList.remove('on'))
    document.querySelector(`#cp-${id} .cp-native`).value=val
  }
}
function cpNative(id,val){
  document.getElementById('cp-preview-'+id).style.background=val
  document.getElementById('cp-hex-'+id).value=val
  document.querySelectorAll(`#cp-${id} .cp-swatch`).forEach(s=>s.classList.remove('on'))
}
function cpGetColor(id){
  const hex=document.getElementById('cp-hex-'+id)?.value
  return /^#[0-9a-fA-F]{6}$/.test(hex)?hex:COLORS[0]
}

function openTaskModal(taskId=null){

  const today=isoToday()
  const form=t||{title:'',projectId:DB.projects[0]?.id||'',resourceId:DB.resources[0]?.id||'',
    sprint:'',manday:1,startDate:today,endDate:calcEndDate(today,1),status:'To do',note:''}
  showModal(`
    <div class="modal-head">
      <div class="modal-title">${t?'Edit Task':'Add Task'}</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg2"><label>Task title</label>
        <input id="f-title" value="${esc(form.title)}" placeholder="e.g. Backend API setup">
      </div>
      <div class="form-row">
        <div class="fg2"><label>Project</label>
          <select id="f-project">
            ${DB.projects.map(p=>`<option value="${p.id}"${form.projectId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="fg2"><label>Resource</label>
          <select id="f-resource">
            ${DB.resources.map(r=>`<option value="${r.id}"${form.resourceId===r.id?' selected':''}>${esc(r.name)}${r.role?' ('+r.role+')':''}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row-3">
        <div class="fg2"><label>Start date</label>
          ${renderDatePicker('task-start',form.startDate,'','onTaskStartChange(v)')}
        </div>
        <div class="fg2"><label>Manday</label>
          <input type="number" id="f-manday" min="0.125" step="0.125" value="${form.manday}"
            oninput="onTaskMandayChange(this.value)">
        </div>
        <div class="fg2"><label>End date</label>
          ${renderDatePicker('task-end',form.endDate,'','')}
        </div>
      </div>
      <div class="form-row">
        <div class="fg2"><label>Sprint</label>
          <input id="f-sprint" value="${esc(form.sprint||'')}" placeholder="Sprint 1">
        </div>
        <div class="fg2"><label>Status</label>
          <div class="status-pills">
            <button class="sp done${form.status==='Done'?' on':''}" onclick="spClick(this,'Done')">Done</button>
            <button class="sp doing${form.status==='Doing'?' on':''}" onclick="spClick(this,'Doing')">Doing</button>
            <button class="sp todo${form.status==='To do'?' on':''}" onclick="spClick(this,'To do')">To do</button>
          </div>
        </div>
      </div>
      <div class="fg2"><label>Note</label><textarea id="f-note" rows="2">${esc(form.note||'')}</textarea></div>
      <div class="modal-foot">
        <div>${t?`<button class="btn btn-danger btn-sm" onclick="deleteTaskDirect('${t.id}')">Delete</button>`:''}</div>
        <div class="modal-foot-r">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveTask('${taskId||''}')">
            ${t?'Save changes':'Add task'}
          </button>
        </div>
      </div>
    </div>`)
}

function spClick(btn,val){
  document.querySelectorAll('.status-pills .sp').forEach(b=>b.classList.remove('on'))
  btn.classList.add('on')
}
function getStatus(){
  const on=document.querySelector('.status-pills .sp.on')
  return on?on.textContent.trim():'To do'
}
function onTaskStartChange(iso){
  const mdEl=document.getElementById('f-manday')
  if(!mdEl) return
  const md=parseFloat(mdEl.value)||1
  const newEnd=calcEndDate(iso,md)
  const inp=document.getElementById('dpinput-task-end')
  if(inp) inp.value=fmtDMY(newEnd)
  if(dpState['task-end']) dpState['task-end'].isoValue=newEnd
}
function onTaskMandayChange(val){
  const md=parseFloat(val)
  if(!md||md<=0) return
  const startInp=document.getElementById('dpinput-task-start')
  if(!startInp) return
  const startISO=dpState['task-start']?.isoValue || (parseDMY(startInp.value)?toISO(parseDMY(startInp.value)):isoToday())
  const newEnd=calcEndDate(startISO,md)
  const endInp=document.getElementById('dpinput-task-end')
  if(endInp) endInp.value=fmtDMY(newEnd)
  if(dpState['task-end']) dpState['task-end'].isoValue=newEnd
}

async function saveTask(taskId){
  const title=document.getElementById('f-title')?.value.trim()
  if(!title){toast('Title is required','err');return}
  const startISO=dpState['task-start']?.isoValue||isoToday()
  const endISO=dpState['task-end']?.isoValue||isoToday()
  const md=parseFloat(document.getElementById('f-manday')?.value)||1
  const obj={
    id:taskId||uid(),
    projectId:document.getElementById('f-project').value,
    resourceId:document.getElementById('f-resource').value,
    title,sprint:document.getElementById('f-sprint').value.trim(),
    manday:md,startDate:startISO,endDate:endISO,
    status:getStatus(),
    note:document.getElementById('f-note')?.value.trim()||''
  }
  if(taskId){const idx=DB.tasks.findIndex(t=>t.id===taskId);if(idx>-1)DB.tasks[idx]=obj}
  else DB.tasks.push(obj)
  closeModal()
  await saveDB(); render()
  toast(taskId?'Task updated ✓':'Task added ✓','ok')
}

async function deleteTaskDirect(id){
  DB.tasks=DB.tasks.filter(t=>t.id!==id)
  closeModal(); await saveDB(); render()
  toast('Task deleted','ok')
}

async function duplicateTask(id){
  const t=DB.tasks.find(x=>x.id===id)
  if(!t) return
  const newT={...t,id:uid(),title:t.title+' (copy)'}
  DB.tasks.push(newT)
  await saveDB(); render()
  toast('Task duplicated ✓','ok')
}

async function saveResource(rid){
  const name=document.getElementById('fr-name')?.value.trim()
  if(!name){toast('Name required','err');return}
  const obj={id:rid||uid(),name,role:document.getElementById('fr-role')?.value||'Dev',color:cpGetColor('res')}
  if(rid){const idx=DB.resources.findIndex(r=>r.id===rid);if(idx>-1)DB.resources[idx]=obj}
  else DB.resources.push(obj)
  closeModal(); await saveDB(); render()
  toast(rid?'Updated ✓':'Added ✓','ok')
}
async function deleteResourceDirect(id){
  DB.resources=DB.resources.filter(r=>r.id!==id)
  closeModal(); await saveDB(); render()
  toast('Resource deleted','ok')
}

function openHolidayModal(){
  showModal(`
    <div class="modal-head">
      <div class="modal-title">🗓 Holiday Settings</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg2"><label>Holidays (Global — affects Manday calculation)</label>
        <div class="holiday-list" id="holiday-list" style="max-height:260px;overflow-y:auto">
          ${renderHolidayList()}
        </div>
        <div class="add-holiday-row" style="margin-top:10px">
          ${renderDatePicker('hol-date',isoToday(),'','')}
          <button class="btn btn-primary btn-sm" onclick="addHoliday()" style="margin-left:8px">+ Add</button>
        </div>
      </div>
      <div class="modal-foot"><div></div>
        <div class="modal-foot-r"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button></div>
      </div>
    </div>`)
}
function renderHolidayList(){
  if(!DB.holidays?.length) return '<div style="color:var(--text3);font-size:12px;padding:8px">No holidays set</div>'
  const sorted=[...DB.holidays].sort((a,b)=>a.date.localeCompare(b.date))
  // Group by year
  const byYear={}
  for(const h of sorted){
    const yr=h.date.slice(0,4)
    if(!byYear[yr]) byYear[yr]=[]
    byYear[yr].push(h)
  }
  const years=Object.keys(byYear).sort((a,b)=>b-a)
  const collapsed=window._holYearCollapsed||{}
  return years.map(yr=>{
    const isCollapsed=collapsed[yr]
    const items=byYear[yr]
    return `<div class="hol-year-group">
      <div class="hol-year-header" onclick="toggleHolYear('${yr}')">
        <span class="hol-year-arrow">${isCollapsed?'▶':'▼'}</span>
        <span class="hol-year-label">${yr}</span>
        <span class="hol-year-count">${items.length} days</span>
      </div>
      ${isCollapsed?'':items.map(h=>`
        <div class="holiday-item">
          <span class="holiday-date">${fmtDMY(h.date)}</span>
          <span class="holiday-name">${new Date(h.date+'T00:00:00').toLocaleString('en',{weekday:'short'})}</span>
          <button class="holiday-del" onclick="removeHoliday('${h.date}')">✕</button>
        </div>`).join('')}
    </div>`
  }).join('')
}
function toggleHolYear(yr){
  if(!window._holYearCollapsed) window._holYearCollapsed={}
  window._holYearCollapsed[yr]=!window._holYearCollapsed[yr]
  const el=document.getElementById('holiday-list')
  if(el) el.innerHTML=renderHolidayList()
}
async function addHoliday(){
  const iso=dpState['hol-date']?.isoValue||isoToday()
  if(!DB.holidays) DB.holidays=[]
  if(DB.holidays.some(h=>h.date===iso)){toast('Already added','warn');return}
  DB.holidays.push({date:iso,name:''})
  document.getElementById('holiday-list').innerHTML=renderHolidayList()
  await saveDB()
  toast('Holiday added ✓','ok')
}
async function removeHoliday(iso){
  DB.holidays=DB.holidays.filter(h=>h.date!==iso)
  document.getElementById('holiday-list').innerHTML=renderHolidayList()
  await saveDB()
}

// ═══════════════════════════════════════════════════════════════════
function openImportModal(){
  showModal(`
    <div class="modal-head">
      <div class="modal-title">📥 Import Excel</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="gist-info-box" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div>Expected columns: <code>Project</code> <code>Sprint</code> <code>Task</code>
        <code>Resource</code> <code>Manday</code> <code>Start</code> <code>End</code> <code>Status</code>
        <br><span style="font-size:11.5px">Supports .xlsx and .csv files. Date format: DD/MM/YYYY</span></div>
        <button class="btn btn-ghost btn-sm" onclick="downloadTemplate()" style="flex-shrink:0;white-space:nowrap">⬇ Template</button>
      </div>
      <div class="import-zone" id="import-zone" onclick="document.getElementById('import-file').click()"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleImportDrop(event)">
        <div class="import-zone-icon">📂</div>
        <div class="import-zone-text">Click to browse or drag & drop your Excel/CSV file here</div>
      </div>
      <input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleImportFile(this)">
      <div id="import-preview"></div>
      <div class="modal-foot"><div></div>
        <div class="modal-foot-r">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" id="import-confirm-btn" style="display:none" onclick="confirmImport()">Import Tasks</button>
        </div>
      </div>
    </div>`)
}

let importRows=[]
function handleImportDrop(e){
  e.preventDefault()
  document.getElementById('import-zone')?.classList.remove('drag-over')
  const file=e.dataTransfer.files[0]
  if(file) parseImportFile(file)
}
function handleImportFile(input){
  const file=input.files[0]
  if(file) parseImportFile(file)
}

function parseImportFile(file){
  const ext=file.name.split('.').pop().toLowerCase()
  if(ext==='csv'){
    // Read as ArrayBuffer first to detect encoding
    const reader=new FileReader()
    reader.onload=e=>{
      const buf=e.target.result
      const bytes=new Uint8Array(buf)
      // Detect BOM
      let encoding='UTF-8'
      if(bytes[0]===0xFF&&bytes[1]===0xFE) encoding='UTF-16LE'
      else if(bytes[0]===0xFE&&bytes[1]===0xFF) encoding='UTF-16BE'
      else if(bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF) encoding='UTF-8'
      else {
        // Heuristic: check if valid UTF-8, else try Windows-874 (Thai)
        try {
          const decoded=new TextDecoder('UTF-8',{fatal:true}).decode(buf)
          // If contains replacement char, try TIS-620
          if(decoded.includes('�')) encoding='windows-874'
        } catch(err) { encoding='windows-874' }
      }
      let text=new TextDecoder(encoding).decode(buf)
      // Strip BOM if present
      if(text.charCodeAt(0)===0xFEFF) text=text.slice(1)
      parseCSV(text)
    }
    reader.readAsArrayBuffer(file)
  } else {
    // XLSX: load SheetJS from CDN
    if(typeof XLSX==='undefined'){
      const s=document.createElement('script')
      s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'
      s.onload=()=>parseXLSX(file)
      document.head.appendChild(s)
    } else parseXLSX(file)
  }
}

function parseXLSX(file){
  const reader=new FileReader()
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'})
    const ws=wb.Sheets[wb.SheetNames[0]]
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false})
    processImportRows(rows)
  }
  reader.readAsArrayBuffer(file)
}

function parseCSV(text){
  const rows=text.split('\n').map(r=>r.split(',').map(c=>c.trim().replace(/^"|"$/g,'')))
  processImportRows(rows)
}

function processImportRows(rows){
  if(!rows.length){toast('Empty file','err');return}
  const header=rows[0].map(h=>String(h||'').trim().toLowerCase())
  const colIdx={
    project: header.findIndex(h=>h==='project'),
    sprint:  header.findIndex(h=>h==='sprint'||h==='note'),
    task:    header.findIndex(h=>h==='task'),
    resource:header.findIndex(h=>h==='resource'),
    manday:  header.findIndex(h=>h==='manday'||h==='man day'||h==='man-day'),
    start:   header.findIndex(h=>h==='start'||h==='start date'),
    end:     header.findIndex(h=>h==='end'||h==='end date'),
    status:  header.findIndex(h=>h==='status')
  }

  const required=['project','task','start','end']
  const missing=required.filter(k=>colIdx[k]===-1)
  if(missing.length){toast('Missing columns: '+missing.join(', '),'err');return}

  importRows=[]
  for(let i=1;i<rows.length;i++){
    const r=rows[i]
    if(!r||r.every(c=>!c)) continue
    const projName=r[colIdx.project]?.trim()
    const taskName=r[colIdx.task]?.trim()
    if(!projName||!taskName) continue

    // Parse dates - supports multiple formats
    const startRaw=String(r[colIdx.start]||'').trim()
    const endRaw=String(r[colIdx.end]||'').trim()
    const startISO=parseFlexDate(startRaw)
    const endISO=parseFlexDate(endRaw)
    if(!startISO||!endISO) continue

    importRows.push({
      projectName:projName,
      sprint:colIdx.sprint>=0?r[colIdx.sprint]?.trim()||'':'',
      title:taskName,
      resourceName:colIdx.resource>=0?r[colIdx.resource]?.trim()||'':'',
      manday:parseFloat(r[colIdx.manday])||1,
      startDate:startISO,endDate:endISO,
      status:colIdx.status>=0?normalizeStatus(r[colIdx.status]):'To do'
    })
  }

  const preview=document.getElementById('import-preview')
  if(!importRows.length){toast('No valid rows found','err');if(preview)preview.innerHTML='';return}

  preview.innerHTML=`<div class="import-preview">
    <strong style="font-size:12px;color:var(--text)">${importRows.length} tasks found:</strong>
    ${importRows.slice(0,8).map(r=>`<div class="import-preview-row">${esc(r.projectName)} › ${esc(r.title)} (${fmtDMY(r.startDate)} – ${fmtDMY(r.endDate)})</div>`).join('')}
    ${importRows.length>8?`<div style="color:var(--text3);font-size:11px">... and ${importRows.length-8} more</div>`:''}
  </div>`

  const btn=document.getElementById('import-confirm-btn')
  if(btn) btn.style.display='inline-flex'
}

function parseFlexDate(s){
  if(!s) return null
  // DD-Mon-YYYY e.g. 09-Feb-2026
  const m1=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/)
  if(m1){
    const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}
    const mo=months[m1[2].toLowerCase()]
    if(mo) return `${m1[3]}-${String(mo).padStart(2,'0')}-${String(m1[1]).padStart(2,'0')}`
  }
  // DD/MM/YYYY
  const m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
  if(m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s
  return null
}

function normalizeStatus(s){
  if(!s) return 'To do'
  const l=s.toLowerCase()
  if(l==='done'||l==='complete'||l==='completed') return 'Done'
  if(l==='doing'||l==='in progress'||l==='inprogress') return 'Doing'
  return 'To do'
}

function downloadTemplate(){
  const csv=[
    'Project,Sprint,Task,Resource,Manday,Start,End,Status',
    'Mantra,Sprint 1,Backend API setup,Hus,3,06/01/2025,10/01/2025,Done',
    'Mantra,Sprint 1,UI Design system,Mic,4,06/01/2025,09/01/2025,Done',
    'EWA,Sprint 2,Dashboard screens,Pack,5,27/01/2025,07/02/2025,Doing',
    'Flowly,Sprint 1,Flow builder core,Nut,5,03/03/2025,14/03/2025,To do',
  ].join('\n')
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  a.href=url; a.download='senna-template.csv'; a.click()
  URL.revokeObjectURL(url)
  toast('Template downloaded ✓','ok')
}
async function confirmImport(){
  let created=0,projNew=0,resNew=0
  for(const row of importRows){
    // Find or create project
    let proj=DB.projects.find(p=>p.name.toLowerCase()===row.projectName.toLowerCase())
    if(!proj){
      proj={id:uid(),name:row.projectName,color:COLORS[DB.projects.length%COLORS.length],description:'Imported'}
      DB.projects.push(proj)
      projNew++
    }
    // Find or create resource
    let res=null
    if(row.resourceName){
      res=DB.resources.find(r=>r.name.toLowerCase()===row.resourceName.toLowerCase())
      if(!res){
        res={id:uid(),name:row.resourceName,role:'Dev',color:COLORS[DB.resources.length%COLORS.length]}
        DB.resources.push(res)
        resNew++
      }
    }
    DB.tasks.push({
      id:uid(),projectId:proj.id,resourceId:res?.id||'',
      title:row.title,sprint:row.sprint,manday:row.manday,
      startDate:row.startDate,endDate:row.endDate,status:row.status
    })
    created++
  }
  closeModal()
  await saveDB(); render()
  toast(`Imported ${created} tasks${projNew?' (+'+projNew+' projects)':''}${resNew?' (+'+resNew+' resources)':''}  ✓`,'ok')
}

  closeModal(); updateGistUI(); await syncFromGist()
}
function clearGist(){
  GIST={id:'',token:''}; localStorage.removeItem('senna_gist')
  closeModal(); updateGistUI(); toast('Disconnected','ok')
}

function showModal(html){
  document.getElementById('modal-overlay')?.remove()
  const el=document.createElement('div')
  el.className='overlay'; el.id='modal-overlay'
  el.innerHTML=`<div class="modal">${html}</div>`
  el.addEventListener('click',e=>{if(e.target===el)closeModal()})
  document.body.appendChild(el)
}
function closeModal(){ document.getElementById('modal-overlay')?.remove() }

  initTheme()

  const sd=localStorage.getItem('senna_db')

  updateGistUI()
  if(GIST.id&&GIST.token) syncFromGist()
  render()
}
